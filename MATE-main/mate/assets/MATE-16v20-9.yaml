name: MultiAgentTracking(16v20, 9)
max_episode_steps: 10000
num_cargoes_per_target: 8
high_capacity_target_split: 0.5
targets_start_with_cargoes: true
bounty_factor: 1.0
shuffle_entities: true
reward_type: dense

camera:
  location_random_range:  # 16 cameras
    - [  700,  850,  700,  850 ]
    - [  700,  850, -850, -700 ]
    - [ -850, -700, -850, -700 ]
    - [ -850, -700,  700,  850 ]

    - [  500,  650,  500,  650 ]
    - [  500,  650, -650, -500 ]
    - [ -650, -500, -650, -500 ]
    - [ -650, -500,  500,  650 ]

    - [  500,  650, -100,  100 ]
    - [ -100,  100,  500,  650 ]
    - [ -650, -500, -100,  100 ]
    - [ -100,  100, -650, -500 ]

    - [  250,  350,  250,  350 ]
    - [  250,  350, -350, -250 ]
    - [ -350, -250, -350, -250 ]
    - [ -350, -250,  250,  350 ]

  min_viewing_angle: 30.0
  max_sight_range: 1000.0
  rotation_step: 5.0
  zooming_step: 2.5
  radius: 40.0

target:
  location_random_range:  # 20 targets
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]

    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]
    - [ -250,  250, -250,  250 ]

  step_size: 20.0
  sight_range: 500.0

obstacle:
  location_random_range:  # 9 obstacles
    - [  200,  800,  200,  800 ]
    - [  200,  800, -800, -200 ]
    - [ -800, -200, -800, -200 ]
    - [ -800, -200,  200,  800 ]

    - [  900,  900, -500,  500 ]
    - [ -500,  500,  900,  900 ]
    - [ -900, -900, -500,  500 ]
    - [ -500,  500, -900, -900 ]

    - [ -200,  200, -200,  200 ]

  radius_random_range: [ 25.0, 100.0 ]
  transmittance: 0.1
